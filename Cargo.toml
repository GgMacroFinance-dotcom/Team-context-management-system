[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/GgMacroFinance-dotcom/Team-context-management-system"

[workspace.dependencies]
tcms-core = { path = "crates/tcms-core" }
tcms-affine = { path = "crates/tcms-affine" }
tcms-git = { path = "crates/tcms-git" }
tcms-store = { path = "crates/tcms-store" }
tcms-index = { path = "crates/tcms-index" }
tcms-search = { path = "crates/tcms-search" }
tcms-pack = { path = "crates/tcms-pack" }
tcms-mcp = { path = "crates/tcms-mcp" }
tcms-write = { path = "crates/tcms-write" }
tcms-review = { path = "crates/tcms-review" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
regex = "1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
getrandom = "0.4"
ulid = "3"
comrak = { version = "1", default-features = false }
gix = { version = "0.90", default-features = false }
sqlx = { version = "0.9", default-features = false }
tantivy = { version = "0.27", default-features = false }
rmcp = { version = "3.11", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-std", "io-util", "process"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
similar = "2"
# AFFiNE 0.27.5 用的是 yjs 13.6，客户端 id 是 32 位；yrs 0.28 默认 53 位，开 small-client 和它一样。
yrs = { version = "0.28", default-features = false, features = ["small-client"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

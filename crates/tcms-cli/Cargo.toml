[package]
name = "tcms-cli"
description = "命令行 tcms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tcms"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
affine-sync-client.workspace = true
anyhow.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
serde_json.workspace = true
tcms-affine.workspace = true
tcms-core.workspace = true
tcms-git.workspace = true
tcms-index.workspace = true
tcms-mcp.workspace = true
tcms-review.workspace = true
tcms-pack.workspace = true
tcms-search.workspace = true
tcms-store.workspace = true
tcms-write.workspace = true
tempfile.workspace = true
tokio.workspace = true

# 内存分配器用 jemalloc（docs/architecture.md 第 10 节“空闲时内存”）。MSVC 上编不了，用系统自带的。
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true

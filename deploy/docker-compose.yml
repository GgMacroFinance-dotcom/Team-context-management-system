# 单独部署团队上下文系统：一个 PostgreSQL 加 tcms。步骤见 docs/deploy-docker.md，简单说：
#
#   cd deploy
#   cp env.example .env               # 填 POSTGRES_PASSWORD、TCMS_DB_PASSWORD
#   docker compose up -d --build
#   docker compose run --rm tcms token add --name "某个 agent" --role macro
#
# 和 I.P. 一起部署时不用这个文件：I.P. 仓库的 rust/docker-compose.yml 里有 tcms 服务，和 I.P. 共用一个 PostgreSQL。
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcms
      POSTGRES_DB: tcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设 POSTGRES_PASSWORD}
      # tcms 服务用的普通账号 tcms_app 的密码。上面的 tcms 是超级用户，行级安全管不了它，只拿来管库、备份。
      TCMS_DB_PASSWORD: ${TCMS_DB_PASSWORD:?在 .env 里设 TCMS_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 空数据卷第一次启动时建 tcms_app 和 schema tcms。
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcms -d tcms"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s

  tcms:
    build: ..
    image: tcms:latest
    restart: unless-stopped
    environment:
      # 密码用 openssl rand -hex 24 生成，只有十六进制字符，直接放进连接串不用转义。
      # 用普通账号 tcms_app 连，数据库的行级安全才起作用（docs/architecture.md 第 5 节）。
      TCMS_DATABASE_URL: postgres://tcms_app:${TCMS_DB_PASSWORD}@postgres:5432/tcms
      # 从别的机器或容器用域名、IP 连时写上它们（逗号隔开）；默认只接受 Host 是本机的请求。
      TCMS_ALLOWED_HOSTS: ${TCMS_ALLOWED_HOSTS:-}
      TCMS_GIT_EMAIL: ${TCMS_GIT_EMAIL:-}
      # 可选：上下文仓库推到自己的 git 远端（docs/deploy-docker.md“推到自己的 git 远端”）。不写就只在卷里。
      TCMS_REMOTE: ${TCMS_REMOTE:-}
      TCMS_REMOTE_BRANCH: ${TCMS_REMOTE_BRANCH:-}
      TCMS_GIT_TOKEN: ${TCMS_GIT_TOKEN:-}
      TCMS_GIT_USERNAME: ${TCMS_GIT_USERNAME:-}
      TCMS_SYNC_SECS: ${TCMS_SYNC_SECS:-60}
      # 可选：远端推送通知的密钥，配了以后推上去马上同步（POST /hooks/push）。
      TCMS_WEBHOOK_SECRET: ${TCMS_WEBHOOK_SECRET:-}
      # 可选：和 AFFiNE 同步（docs/affine-sync.md 7.4）。设了 TCMS_AFFINE_WORKSPACE 才一直跟着同步。
      TCMS_AFFINE_URL: ${TCMS_AFFINE_URL:-}
      TCMS_AFFINE_EMAIL: ${TCMS_AFFINE_EMAIL:-}
      TCMS_AFFINE_PASSWORD: ${TCMS_AFFINE_PASSWORD:-}
      TCMS_AFFINE_WORKSPACE: ${TCMS_AFFINE_WORKSPACE:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # /mcp 和审核页 /review。只给本机；对外提供时放在 HTTPS 反向代理后面。
      - "127.0.0.1:7341:7341"
    volumes:
      - context:/var/lib/tcms/context
    stop_grace_period: 30s

volumes:
  pg-data:
  context:
